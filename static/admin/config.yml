# ABOUTME: Sveltia CMS configuration for editing OpenDLP documentation content
# ABOUTME: Defines the GitHub backend, media storage, and content collections

backend:
  name: github
  repo: sortitionfoundation/opendlp-docs
  branch: main
  # Set base_url to your Sveltia CMS Authenticator URL for OAuth login.
  # Without this, editors can still sign in using a GitHub personal access token.
  base_url: https://sveltia-cms-auth.hamish-10d.workers.dev

media_folder: static/files
public_folder: /files

collections:
  - name: root-pages
    label: Pages
    label_singular: Page
    folder: content
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    fields: &page_fields
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown
  - name: assembly-pages
    label: Assembly Pages
    label_singular: Assembly Page
    folder: content/citizens-assembly
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    fields: *page_fields
    index_file:
      fields: &index_file_fields
        - label: Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: string
          required: false
        - label: Weight
          name: weight
          widget: int
          required: false
        - label: Body
          name: body
          widget: markdown
  - name: data-legal-pages
    label: Data and Legal Pages
    label_singular: Data and Legal Page
    folder: content/data-and-legal
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    fields: *page_fields
    index_file:
      fields: *index_file_fields
