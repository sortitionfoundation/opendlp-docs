{{/* ABOUTME: Site header with the OpenDLP logo, search and a link to the OpenDLP app */}}
{{/* ABOUTME: White bar with a bottom border, matching the navigation bar in the app */}}
<header class="site-header">
  <div class="site-header__inner">
    <a href="{{ "/" | relURL }}" class="site-header__logo-link">
      <img src="{{ "img/opendlp-small-sized-logo.svg" | relURL }}"
           alt="OpenDLP"
           width="142"
           height="64" />
    </a>
    <div class="site-header__actions">
      <div class="header-search">
        <div id="search"></div>
      </div>
      <a href="{{ .Site.Params.appURL }}" class="btn btn--secondary">Go to OpenDLP</a>
    </div>
  </div>
</header>
