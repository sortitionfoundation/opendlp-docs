{{/* ABOUTME: Single page template for standard content pages */}}
{{/* ABOUTME: Renders markdown content beside the side navigation */}}
{{ define "content" }}
<div class="docs-layout">
  <div class="sidebar-column">
    {{ partial "sidebar.html" . }}
  </div>
  <div class="docs-content">
    <h1 class="page-title">{{ .Title }}</h1>
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</div>
{{ end }}
